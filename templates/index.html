
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Briefly AI | News Dashboard</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <header class="topbar">
        <a class="brand" href="/">Briefly<span>AI</span></a>
        <div class="tagline">Understand more. Read less.</div>
    </header>

    <main class="container">
        <section class="hero">
            <div class="eyebrow">YOUR PERSONAL NEWSROOM</div>
            <h1>The world, <span>in brief.</span></h1>
            <p>Explore headlines and turn long stories into quick summaries.</p>

            <form id="searchForm" class="searchbar">
                <input id="searchInput" type="search"
                    placeholder="Search news topics..." aria-label="Search news">
                <button type="submit">Search</button>
            </form>
        </section>

        <section class="summarizer panel">
            <div>
                <div class="eyebrow">AI TOOL</div>
                <h2>Summarize any article</h2>
            </div>
            <textarea id="articleInput"
                placeholder="Paste a news article here..."></textarea>
            <button id="summarizeBtn" class="primary" type="button">
                ✦ Summarize News
            </button>
            <div id="summaryOutput" class="summary-output">
                Your summary will appear here.
            </div>
        </section>

        <section class="news-section">
            <div class="section-heading">
                <div>
                    <div class="eyebrow">STAY INFORMED</div>
                    <h2 id="newsHeading">Top Headlines</h2>
                </div>
                <button id="refreshBtn" class="secondary" type="button">
                    ↻ Refresh
                </button>
            </div>

            <nav class="categories" id="categories">
                <button class="category active" data-category="general">Top</button>
                <button class="category" data-category="world">World</button>
                <button class="category" data-category="nation">India</button>
                <button class="category" data-category="technology">Technology</button>
                <button class="category" data-category="business">Business</button>
                <button class="category" data-category="science">Science</button>
                <button class="category" data-category="health">Health</button>
                <button class="category" data-category="sports">Sports</button>
                <button class="category" data-category="entertainment">Entertainment</button>
            </nav>

            <p id="newsStatus" class="status">Loading news...</p>
            <div id="newsGrid" class="news-grid"></div>
        </section>
    </main>

    <footer>Briefly AI · News for curious minds</footer>

    <script>
        const grid = document.getElementById("newsGrid");
        const statusText = document.getElementById("newsStatus");
        const heading = document.getElementById("newsHeading");
        const summaryOutput = document.getElementById("summaryOutput");
        let currentCategory = "general";

        async function loadNews(category = "general") {
            currentCategory = category;
            heading.textContent = category === "general"
                ? "Top Headlines"
                : category.charAt(0).toUpperCase() + category.slice(1) + " News";

            document.querySelectorAll(".category").forEach(button => {
                button.classList.toggle(
                    "active", button.dataset.category === category
                );
            });

            grid.replaceChildren();
            statusText.textContent = "Loading news...";

            try {
                const response = await fetch(
                    `/api/news?category=${encodeURIComponent(category)}`
                );
                const data = await response.json();

                if (!response.ok) throw new Error(data.error || "Could not load news.");

                renderNews(data.articles || []);
                statusText.textContent = data.articles?.length
                    ? `${data.articles.length} stories`
                    : "No articles found.";
            } catch (error) {
                statusText.textContent = error.message;
            }
        }

        function renderNews(articles) {
            grid.replaceChildren();

            articles.forEach(article => {
                const card = document.createElement("article");
                card.className = "news-card";

                if (article.image) {
                    const image = document.createElement("img");
                    image.src = article.image;
                    image.alt = "";
                    image.loading = "lazy";
                    image.onerror = () => image.remove();
                    card.appendChild(image);
                }

                const body = document.createElement("div");
                body.className = "card-body";

                const source = document.createElement("div");
                source.className = "source";
                source.textContent = article.source?.name || "News";

                const title = document.createElement("h3");
                title.textContent = article.title || "Untitled story";

                const description = document.createElement("p");
                description.textContent =
                    article.description || "Open the article to read more.";

                const actions = document.createElement("div");
                actions.className = "card-actions";

                const summarizeButton = document.createElement("button");
                summarizeButton.className = "small-button";
                summarizeButton.textContent = "✦ Summarize";
                summarizeButton.addEventListener("click", () => {
                    const text = [
                        article.title,
                        article.description,
                        article.content
                    ].filter(Boolean).join(". ");

                    document.getElementById("articleInput").value = text;
                    summarizeArticle(text);
                    document.querySelector(".summarizer").scrollIntoView({
                        behavior: "smooth", block: "start"
                    });
                });

                const link = document.createElement("a");
                link.className = "read-link";
                link.href = article.url || "#";
                link.target = "_blank";
                link.rel = "noopener noreferrer";
                link.textContent = "Read article ↗";

                actions.append(summarizeButton, link);
                body.append(source, title, description, actions);
                card.appendChild(body);
                grid.appendChild(card);
            });
        }

        async function summarizeArticle(article) {
            summaryOutput.textContent = "Generating summary...";
            document.getElementById("summarizeBtn").disabled = true;

            try {
                const response = await fetch("/summarize", {
                    method: "POST",
                    headers: {"Content-Type": "application/json"},
                    body: JSON.stringify({article})
                });

                const data = await response.json();
                if (!response.ok) throw new Error(data.error || "Summary failed.");

                summaryOutput.replaceChildren();

                const text = document.createElement("p");
                text.textContent = data.summary || "No summary returned.";

                const mode = document.createElement("small");
                mode.textContent = "Method: " + (data.mode || "Unknown");

                summaryOutput.append(text, mode);
            } catch (error) {
                summaryOutput.textContent = error.message;
            } finally {
                document.getElementById("summarizeBtn").disabled = false;
            }
        }

        document.getElementById("summarizeBtn").addEventListener("click", () => {
            summarizeArticle(document.getElementById("articleInput").value.trim());
        });

        document.querySelectorAll(".category").forEach(button => {
            button.addEventListener("click", () => loadNews(button.dataset.category));
        });

        document.getElementById("refreshBtn").addEventListener("click", () => {
            loadNews(currentCategory);
        });

        document.getElementById("searchForm").addEventListener("submit", async event => {
            event.preventDefault();
            const query = document.getElementById("searchInput").value.trim();
            if (!query) return;

            heading.textContent = `Search: ${query}`;
            grid.replaceChildren();
            statusText.textContent = "Searching news...";

            try {
                const response = await fetch(`/api/search?q=${encodeURIComponent(query)}`);
                const data = await response.json();

                if (!response.ok) throw new Error(data.error || "Search failed.");

                renderNews(data.articles || []);
                statusText.textContent = data.articles?.length
                    ? `${data.articles.length} results`
                    : "No articles found. Try another search.";
            } catch (error) {
                statusText.textContent = error.message;
            }
        });

        loadNews();
    </script>
</body>
</html>
